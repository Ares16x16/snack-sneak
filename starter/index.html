<!doctype html><html lang="en" data-game-template><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173e37">
<meta name="description" data-game-description content="{{GAME_DESCRIPTION}}"><meta property="og:title" data-game-title content="{{GAME_NAME}}"><meta property="og:description" data-game-description content="{{GAME_DESCRIPTION}}"><meta property="og:type" content="website">
<!-- SITE_META --><title data-game-title>{{GAME_NAME}}</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/game-kit/arcade.css"><link rel="stylesheet" href="/assets/game-kit/share.css"><script type="module" src="/assets/main.js"></script>
<link rel="stylesheet" href="/assets/game-kit/menu.css"><script type="module" src="/assets/game-kit/menu.js"></script></head><body>
<a class="kit-skip" href="#kit-station">Skip to game</a><header class="kit-wrap kit-header"><a href="/" class="kit-brand" data-game-name>{{GAME_NAME}}</a><div class="kit-header-actions"><details class="game-menu" data-game-menu><summary>Games</summary><nav aria-label="Games"><a href="/" data-game-name>{{GAME_NAME}}</a></nav></details><select id="kit-language" class="language-select" aria-label="Language"><option value="en">EN</option><option value="zh-HK">HK</option><option value="zh-TW">TW</option></select></div></header>
<main class="kit-wrap"><section class="kit-layout"><div class="kit-intro"><h1 data-game-name>{{GAME_NAME}}</h1><p id="kit-tagline" class="kit-tagline"></p><p id="kit-instructions"></p><div class="kit-modes" role="tablist" aria-label="Game mode"><button id="kit-daily" role="tab" type="button" aria-selected="true">Daily challenge</button><button id="kit-practice" role="tab" type="button" aria-selected="false">Practice</button></div><p id="kit-seed" hidden></p><p id="kit-best"></p><p id="kit-target" hidden></p></div>
<div id="kit-station" class="kit-station" tabindex="-1"><div class="kit-hud"><div><small id="kit-time-label">TIME LEFT</small><strong id="kit-time">10</strong></div><div><small id="kit-score-label">SCORE</small><strong id="kit-score">0</strong></div><button id="kit-pause" type="button" hidden>Pause</button></div>
<div id="kit-stage" class="kit-stage"><canvas id="kit-canvas" width="820" height="500" tabindex="0" role="img" aria-label="Game play area"></canvas><div id="kit-start-layer" class="kit-overlay"><button id="kit-start" class="kit-primary" type="button">Start playing</button></div><div id="kit-pause-layer" class="kit-overlay" hidden><h2 id="kit-paused">Take a breather.</h2><button id="kit-resume" class="kit-primary" type="button">Resume</button><button id="kit-restart" class="kit-text" type="button">Start again</button></div></div>
<button id="kit-action" class="kit-action" type="button" hidden>STAMP AN ORDER</button>
<section id="kit-result" class="kit-result" hidden tabindex="-1" aria-labelledby="kit-result-title"><h2 id="kit-result-title"></h2><strong id="kit-final-score"></strong><p id="kit-final-detail"></p><div class="kit-result-actions"><button id="kit-replay" class="kit-primary" type="button">One more try</button><button id="kit-share" class="kit-secondary" type="button">Share score</button></div><div id="kit-sharing" hidden></div></section>
</div></section><p id="kit-message" role="status" aria-live="polite"></p></main>
<footer class="kit-wrap kit-footer"><span data-game-name>{{GAME_NAME}}</span><nav><a href="/about.html">About</a><a href="/how-to-play.html">How to play</a><a href="/privacy.html">Privacy</a></nav></footer><noscript>This game needs JavaScript. 請啟用 JavaScript。</noscript>
</body></html>
